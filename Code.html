<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Porchlight</title>
<style>
 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
 --bg: #faf8f5;
 --card: #ffffff;
 --text: #1a1a1a;
 --text-muted: #6b6b6b;
 --accent: #c8102e;
 --accent-light: #fce8ec;
 --border: #e0ddd7;
 --shadow: rgba(0,0,0,0.04);
 --highlight-bg: #f9f0a0;
 --highlight-border: #d4c84a;
 --tag-bg: #f0ede6;
 --font-serif: Georgia, 'Times New Roman', Times, serif;
 --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 }
 body {
 font-family: var(--font-serif);
 background: var(--bg);
 color: var(--text);
 line-height: 1.7;
 min-height: 100vh;
 }
 /* header */
.header {
 border-bottom: 1px solid var(--border);
 padding: 1.5rem 2rem;
 background: var(--card);
 position: sticky;
 top: 0;
 z-index: 100;
 }
.header-inner {
 max-width: 1100px;
 margin: 0 auto;
 display: flex;
 align-items: center;
 justify-content: space-between;
 flex-wrap: wrap;
 gap: 1rem;
 }
.logo {
 font-family: var(--font-sans);
 font-size: 1.5rem;
 font-weight: 700;
 letter-spacing: -0.5px;
 color: var(--accent);
 text-decoration: none;
 }
.logo span { color: var(--text); }
.header-actions { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.btn {
 font-family: var(--font-sans);
 font-size: 0.85rem;
 padding: 0.5rem 1.1rem;
 border-radius: 6px;
 border: 1px solid var(--border);
 background: var(--card);
 color: var(--text);
 cursor: pointer;
 transition: all 0.15s;
 font-weight: 500;
 }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
 background: var(--accent);
 color: white;
 border-color: var(--accent);
 }
.btn-primary:hover { background: #a00d26; border-color: #a00d26; color: white; }
.btn-sm { padding: 0.35rem 0.85rem; font-size: 0.8rem; }

 /* main layout */
.container { max-width: 1100px; margin: 0 auto; padding: 2rem; }

 /* story list */
.story-list { display: flex; flex-direction: column; gap: 1.25rem; }
.story-card {
 background: var(--card);
 border: 1px solid var(--border);
 border-radius: 8px;
 padding: 1.5rem 2rem;
 cursor: pointer;
 transition: box-shadow 0.15s, border-color 0.15s;
 position: relative;
 }
.story-card:hover { box-shadow: 0 2px 12px var(--shadow); border-color: #ccc; }
.story-card.title {
 font-size: 1.25rem;
 font-weight: 700;
 margin-bottom: 0.3rem;
 color: var(--text);
 }
.story-card.meta {
 font-family: var(--font-sans);
 font-size: 0.8rem;
 color: var(--text-muted);
 display: flex;
 gap: 1rem;
 flex-wrap: wrap;
 margin-bottom: 0.5rem;
 }
.story-card.snippet {
 font-size: 0.95rem;
 color: var(--text-muted);
 line-height: 1.5;
 display: -webkit-box;
 -webkit-line-clamp: 2;
 -webkit-box-orient: vertical;
 overflow: hidden;
 }
.story-card.stats {
 font-family: var(--font-sans);
 font-size: 0.8rem;
 color: var(--text-muted);
 display: flex;
 gap: 1rem;
 margin-top: 0.75rem;
 padding-top: 0.75rem;
 border-top: 1px solid var(--border);
 }
.story-card.stats.liked { color: var(--accent); font-weight: 600; }

 /* story detail */
.story-detail { display: none; }
.story-detail.active { display: block; }
.story-list.hidden { display: none; }
.back-btn {
 font-family: var(--font-sans);
 font-size: 0.85rem;
 color: var(--text-muted);
 cursor: pointer;
 display: inline-flex;
 align-items: center;
 gap: 0.4rem;
 margin-bottom: 1.5rem;
 border: none;
 background: none;
 padding: 0;
 }
.back-btn:hover { color: var(--accent); }
.detail-title {
 font-size: 2rem;
 font-weight: 700;
 line-height: 1.3;
 margin-bottom: 0.5rem;
 }
.detail-meta {
 font-family: var(--font-sans);
 font-size: 0.85rem;
 color: var(--text-muted);
 margin-bottom: 1.5rem;
 display: flex;
 gap: 1rem;
 flex-wrap: wrap;
 }
.detail-body {
 font-size: 1.05rem;
 line-height: 1.8;
 max-width: 680px;
 position: relative;
 }
.detail-body p { margin-bottom: 1.25rem; }

 /* highlightable text */
.detail-body.hl-text {
 cursor: pointer;
 transition: background 0.15s;
 border-radius: 2px;
 padding: 0 2px;
 margin: 0 -2px;
 }
.detail-body.hl-text:hover { background: rgba(200,16,46,0.06); }
.detail-body.hl-text.highlighted {
 background: var(--highlight-bg);
 border-bottom: 2px solid var(--accent);
 }
.detail-body.hl-text.has-annotation {
 background: var(--highlight-bg);
 border-bottom: 2px solid var(--accent);
 cursor: pointer;
 }

 /* annotation popup */
.annotation-popup {
 position: absolute;
 background: var(--card);
 border: 1px solid var(--border);
 border-radius: 8px;
 box-shadow: 0 8px 30px rgba(0,0,0,0.12);
 padding: 1rem;
 width: 320px;
 max-height: 300px;
 overflow-y: auto;
 z-index: 200;
 display: none;
 font-family: var(--font-sans);
 font-size: 0.85rem;
 }
.annotation-popup.show { display: block; }
.annotation-popup.anno-item {
 padding: 0.5rem 0;
 border-bottom: 1px solid var(--border);
 }
.annotation-popup.anno-item:last-child { border-bottom: none; }
.annotation-popup.anno-author {
 font-weight: 600;
 font-size: 0.75rem;
 color: var(--text-muted);
 margin-bottom: 0.2rem;
 }
.annotation-popup.anno-text { line-height: 1.4; }
.annotation-popup.anno-input {
 width: 100%;
 border: 1px solid var(--border);
 border-radius: 4px;
 padding: 0.5rem;
 font-family: var(--font-sans);
 font-size: 0.8rem;
 resize: vertical;
 margin-top: 0.5rem;
 }
.annotation-popup.anno-submit {
 margin-top: 0.5rem;
 font-size: 0.75rem;
 }

 /* like/dislike */
.vote-bar {
 display: flex;
 gap: 0.75rem;
 align-items: center;
 margin: 1.5rem 0;
 font-family: var(--font-sans);
 }
.vote-btn {
 display: flex;
 align-items: center;
 gap: 0.35rem;
 padding: 0.4rem 0.9rem;
 border: 1px solid var(--border);
 border-radius: 6px;
 background: var(--card);
 cursor: pointer;
 font-size: 0.85rem;
 transition: all 0.15s;
 }
.vote-btn:hover { border-color: var(--accent); }
.vote-btn.active-like { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.vote-btn.active-dislike { background: #f0f0f0; border-color: #999; color: #666; }

 /* comments */
.comments-section {
 max-width: 680px;
 margin-top: 2rem;
 padding-top: 1.5rem;
 border-top: 1px solid var(--border);
 }
.comments-section h3 {
 font-family: var(--font-sans);
 font-size: 1rem;
 font-weight: 600;
 margin-bottom: 1rem;
 }
.comment {
 padding: 0.75rem 0;
 border-bottom: 1px solid var(--border);
 font-size: 0.9rem;
 }
.comment:last-child { border-bottom: none; }
.comment.author {
 font-family: var(--font-sans);
 font-size: 0.75rem;
 font-weight: 600;
 color: var(--text-muted);
 }
.comment.text { margin-top: 0.15rem; }
.comment-input-area {
 display: flex;
 gap: 0.5rem;
 margin-top: 0.75rem;
 }
.comment-input-area input {
 flex: 1;
 border: 1px solid var(--border);
 border-radius: 6px;
 padding: 0.6rem 0.9rem;
 font-family: var(--font-sans);
 font-size: 0.85rem;
 }
.comment-input-area input:focus { outline: none; border-color: var(--accent); }

 /* modal for new story */
.modal-overlay {
 position: fixed;
 inset: 0;
 background: rgba(0,0,0,0.4);
 z-index: 300;
 display: none;
 align-items: center;
 justify-content: center;
 }
.modal-overlay.show { display: flex; }
.modal {
 background: var(--card);
 border-radius: 12px;
 padding: 2rem;
 width: 90%;
 max-width: 560px;
 max-height: 80vh;
 overflow-y: auto;
 }
.modal h2 {
 font-family: var(--font-sans);
 font-size: 1.2rem;
 font-weight: 600;
 margin-bottom: 1rem;
 }
.modal label {
 font-family: var(--font-sans);
 font-size: 0.8rem;
 font-weight: 500;
 display: block;
 margin-top: 1rem;
 margin-bottom: 0.3rem;
 }
.modal input,.modal textarea {
 width: 100%;
 border: 1px solid var(--border);
 border-radius: 6px;
 padding: 0.6rem 0.9rem;
 font-family: var(--font-sans);
 font-size: 0.9rem;
 }
.modal textarea { min-height: 200px; resize: vertical; }
.modal input:focus,.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal-actions {
 display: flex;
 gap: 0.75rem;
 justify-content: flex-end;
 margin-top: 1.5rem;
 }

 /* empty state */
.empty-state {
 text-align: center;
 padding: 4rem 2rem;
 color: var(--text-muted);
 }
.empty-state p { font-size: 1.1rem; margin-bottom: 0.5rem; }

 /* responsive */
 @media (max-width: 640px) {
.header { padding: 1rem; }
.container { padding: 1rem; }
.story-card { padding: 1rem 1.25rem; }
.detail-title { font-size: 1.5rem; }
.modal { padding: 1.25rem; }
 }
</style>
</head>
<body>

<div class="header">
 <div class="header-inner">
 <a href="#" class="logo" onclick="showList()">The <span>Porchlight</span></a>
 <div class="header-actions">
 <button class="btn btn-primary" onclick="openNewStory()">+ New Writing</button>
 </div>
 </div>
</div>

<div class="container">

 <div id="listView" class="story-list"></div>

 <div id="detailView" class="detail">
 <button class="back-btn" onclick="showList()">← Back to stories</button>
 <div class="detail-title" id="detailTitle"></div>
 <div class="detail-meta">
 <span id="detailDate"></span>
 <span id="detailLikes"></span>
 <span id="detailComments"></span>
 </div>
 <div class="vote-bar">
 <button class="vote-btn" id="likeBtn" onclick="vote(1)">👍 Like <span id="likeCount">0</span></button>
 <button class="vote-btn" id="dislikeBtn" onclick="vote(-1)">👎 Dislike <span id="dislikeCount">0</span></button>
 </div>
 <div class="detail-content" id="detailContent"></div>

 <div class="annotation-popup" id="annoPopup">
 <div id="annoItems"></div>
 <textarea class="anno-input" id="annoInput" placeholder="Add your thought on this passage..." rows="2"></textarea>
 <button class="btn btn-sm btn-primary anno-submit" onclick="submitAnnotation()">Post</button>
 </div>

 <div class="comments-section">
 <h3>Comments</h3>
 <div id="commentList"></div>
 <div class="comment-input-area">
 <input type="text" id="commentInput" placeholder="Write a comment...">
 <button class="btn btn-sm btn-primary" onclick="addComment()">Post</button>
 </div>
 </div>
 </div>
</div>

<div class="modal-overlay" id="storyModal">
 <div class="modal">
 <h2>New Writing</h2>
 <label>Title</label>
 <input type="text" id="newTitle" placeholder="Story title...">
 <label>Author name</label>
 <input type="text" id="newAuthor" placeholder="Your name or pen name">
 <label>Story</label>
 <textarea id="newBody" placeholder="Write your story here..."></textarea>
 <div class="modal-actions">
 <button class="btn" onclick="closeModal()">Cancel</button>
 <button class="btn btn-primary" onclick="saveNewStory()">Publish</button>
 </div>
 </div>
</div>

<script>
// ===== DATA =====
let stories = [];
let currentId = null;
let selectedAnnoIndex = null;

function loadData() {
 try {
 const d = localStorage.getItem('porchlight_data');
 if (d) stories = JSON.parse(d);
 } catch(e) { stories = []; }
}
function saveData() {
 localStorage.setItem('porchlight_data', JSON.stringify(stories));
}

// ===== UTILS =====
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function formatDate(ts) {
 return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ===== LIST =====
function renderList() {
 const list = document.getElementById('listView');
 const sorted =...stories.sort((a,b) => {
 const scoreA = (a.likes||0) - (a.dislikes||0);
 const scoreB = (b.likes||0) - (b.dislikes||0);
 if (scoreB!== scoreA) return scoreB
